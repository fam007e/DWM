name: Release DWM Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version name to release (e.g. v0.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libx11-dev libxinerama-dev libxft-dev libimlib2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-res0-dev libxrender-dev libxrandr-dev \
            fontconfig pkg-config

      - name: Build and Package Release
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION_CLEAN=$(echo "$TAG" | sed 's/^v//')
          echo "Building DWM release for $TAG (version: $VERSION_CLEAN)"

          make clean
          # Use -O2 for generic portable binary instead of host-specific -march=native
          make dwm VERSION="$VERSION_CLEAN" OPTIMISATIONS="-O2"
          make release VERSION="$VERSION_CLEAN"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION_CLEAN=$(echo "$TAG" | sed 's/^v//')

          # Generate changelog from git history
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)" "${PREV_TAG}..${TAG}" 2>/dev/null || git log -n 20 --oneline --pretty=format:"* %s (%h)")
          else
            CHANGELOG=$(git log -n 20 --oneline --pretty=format:"* %s (%h)")
          fi

          mkdir -p release
          echo "$CHANGELOG" > release/changelog.txt

          # Locate release archive
          ARCHIVE="release/dwm-${VERSION_CLEAN}.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE=$(ls release/*.tar.gz 2>/dev/null | head -n 1)
          fi

          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "Error: Release archive not found!"
            exit 1
          fi

          # Compute SHA-256 checksum
          cd release
          ARCHIVE_NAME=$(basename "$ARCHIVE")
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cd ..

          echo "Publishing release $TAG..."
          gh release create "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            --title "Release $TAG" \
            --notes "$CHANGELOG"
