[book]
authors = ["fam007e"]
language = "en"
src = "src"
title = "DWM - Modern & Hardened Edition"
description = "Comprehensive documentation for DWM Modern & Hardened Edition with Quickshell integration and dynamic theming."

[output.html]
git-repository-url = "https://github.com/fam007e/DWM"
edit-url-template = "https://github.com/fam007e/DWM/edit/main/docs/src/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
